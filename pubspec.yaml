name: toadtimer
description: "toadTIMER - a premium Pomodoro timer with quick tiles, session stats, local notifications and Riverpod state management."
publish_to: "none"
version: 1.2.1+4

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management (the provider/riverpod practice core of this app)
  flutter_riverpod: ^2.5.1

  # Persistence
  shared_preferences: ^2.3.2

  # Notifications
  flutter_local_notifications: ^17.2.3
  flutter_timezone: ^3.0.1
  timezone: ^0.9.4

  # Completion chime
  audioplayers: ^6.1.0

  # toadmark family icon set (Lucide-style stroke SVGs)
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/icon/
    - assets/icons/

  # toadmark family typography: Inter (body) + Sora (display), bundled so the
  # app never reaches for the network to look right.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-600.ttf
          weight: 600
        - asset: assets/fonts/Sora-700.ttf
          weight: 700
        - asset: assets/fonts/Sora-800.ttf
          weight: 800

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/toad_icon.png"
  adaptive_icon_background: "#0B100F"
  adaptive_icon_foreground: "assets/icon/toad_icon.png"
