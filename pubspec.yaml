name: toadtimer
description: "toadTIMER - a premium Pomodoro timer with quick tiles, session stats, local notifications and Riverpod state management."
publish_to: "none"
version: 1.1.1+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management (the provider/riverpod practice core of this app)
  flutter_riverpod: ^2.5.1

  # Persistence
  shared_preferences: ^2.3.2

  # Notifications
  flutter_local_notifications: ^17.2.3
  flutter_timezone: ^3.0.1
  timezone: ^0.9.4

  # Completion chime
  audioplayers: ^6.1.0

  # Premium typography
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/icon/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/toad_icon.png"
  adaptive_icon_background: "#09090b"
  adaptive_icon_foreground: "assets/icon/toad_icon.png"
