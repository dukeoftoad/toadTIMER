# Release pipeline — cuts a GitHub Release whenever a version tag is pushed.
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Runs the lint + unit-test gates, then builds a release APK and AAB and
# attaches both to an auto-generated GitHub Release.
#
# Signing: the release build is signed with the real upload key. CI decodes
# android/app/toadtimer-release.jks and android/key.properties from the
# repository secrets (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) before the Gradle build. If the
# secrets are missing, the build falls back to debug signing (see
# android/app/build.gradle).

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.24.5"

jobs:
  release:
    name: Test, build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Restore platform scaffolding (android/, ios/)
        run: flutter create --platforms android,ios --org dev.toad --project-name toadtimer .

      - name: Restore release signing key (from secrets)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_B64 secret is not set - falling back to debug signing."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > android/app/toadtimer-release.jks
          {
            echo "storeFile=toadtimer-release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
          keytool -list -keystore android/app/toadtimer-release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Release signing key restored (alias: $ANDROID_KEY_ALIAS)."

      - name: Install dependencies
        run: flutter pub get

      - name: Apply launcher icons
        run: dart run flutter_launcher_icons

      - name: Lint gate
        run: flutter analyze

      - name: Unit test gate
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release app bundle (AAB)
        run: flutter build appbundle --release

      - name: Rename artifacts
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp build/app/outputs/flutter-apk/app-release.apk "toadtimer-${TAG}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "toadtimer-${TAG}.aab"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            toadtimer-*.apk
            toadtimer-*.aab
          generate_release_notes: true
