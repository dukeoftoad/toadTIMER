name: Key recovery (temp)
on:
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Decode and export encrypted keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PASS: ${{ secrets.KEY_RECOVERY_PASS }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > /tmp/key.jks
          keytool -list -keystore /tmp/key.jks -storepass 'ToadTimer!Release2025' -alias toadtimer >/dev/null 2>&1 && echo "keytool verify: OK"
          openssl enc -aes-256-cbc -pbkdf2 -in /tmp/key.jks -pass env:PASS | base64 -w0 | fold -w 200
          rm -f /tmp/key.jks
